[package]
name = "voiceflow-local"
version = "0.1.0"
description = "Local-first voice-to-clipboard desktop assistant"
authors = ["VoiceFlow Local"]
edition = "2021"
rust-version = "1.77"

# The library is what Tauri builds; `main.rs` is a thin launcher.
[lib]
name = "voiceflow_local_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }

# Async runtime (Tauri already pulls tokio; we use the multi-thread runtime).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }

# Local HTTP client for the Foundry Local OpenAI-compatible endpoint.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Audio capture + WAV writing.
cpal = "0.15"
hound = "3.5"

# In-process whisper.cpp bindings. Gated behind the (opt-in) `whisper` feature so
# a fresh checkout builds and runs in mock mode with NO C/C++ + CMake toolchain.
# Enable real local transcription with `--features whisper` (see README).
whisper-rs = { version = "0.14", optional = true }

[features]
# Mock-first: the default build needs no native toolchain and runs end-to-end.
default = []
# Enables the real WhisperCppProvider. Requires CMake + a C/C++ compiler AND a
# STABLE libclang (LLVM 17.x/18.x) — very new libclang (20+/trunk) mis-parses the
# whisper.cpp headers and fails to build. See README "Native build & packaging".
whisper = ["dep:whisper-rs"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
