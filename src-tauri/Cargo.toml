[package]
name = "voiceflow-local"
version = "0.1.0"
description = "Local-first voice-to-clipboard desktop assistant"
authors = ["VoiceFlow Local"]
edition = "2021"
rust-version = "1.77"

# The library is what Tauri builds; `main.rs` is a thin launcher.
[lib]
name = "voiceflow_local_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }

# Async runtime (Tauri already pulls tokio; we use the multi-thread runtime).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }

# Local HTTP client for the Foundry Local OpenAI-compatible endpoint.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Audio capture + WAV writing.
cpal = "0.15"
hound = "3.5"

# In-process whisper.cpp bindings. Gated behind the default `whisper` feature so
# the crate still type-checks on machines without a C/C++ + CMake toolchain
# (build with `--no-default-features` to skip native whisper compilation).
whisper-rs = { version = "0.14", optional = true }

[features]
default = ["whisper"]
# Enables the real WhisperCppProvider (requires CMake + a C/C++ compiler).
whisper = ["dep:whisper-rs"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
