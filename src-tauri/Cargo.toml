[package]
name = "voiceflow-local"
version = "0.1.0"
description = "Local-first voice-to-clipboard desktop assistant"
authors = ["VoiceFlow Local"]
edition = "2021"
rust-version = "1.77"

# The library is what Tauri builds; `main.rs` is a thin launcher.
[lib]
name = "voiceflow_local_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }

# Async runtime (Tauri already pulls tokio; we use the multi-thread runtime).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }

# Local HTTP client for the Foundry Local endpoint and model downloads.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# Stream combinators for download progress.
futures-util = "0.3"

# Audio capture + WAV writing.
cpal = "0.15"
hound = "3.5"

# Local audio playback for TTS output (pure-Rust, no native toolchain).
rodio = { version = "0.19", default-features = false }

# Checksum verification for downloaded models.
sha2 = "0.10"

# Local, self-contained speech engine (STT + TTS) via sherpa-onnx. Gated behind
# the (opt-in) `sherpa` feature so a fresh checkout builds and runs in mock mode
# with NO native speech toolchain. The `download-binaries` + `tts` default
# features fetch PREBUILT sherpa-onnx + ONNX Runtime libraries — no CMake / C++
# compiler is ever required (a bindgen libclang is needed only to *build* the
# engine from source; end users of the prebuilt release need nothing). See README.
sherpa-rs = { version = "0.6.8", optional = true }

[features]
# Mock-first: the default build needs no native speech toolchain and runs
# end-to-end (mock STT + mock TTS + mock/Foundry rewrite).
default = []
# Enables the real Sherpa STT + TTS providers backed by prebuilt sherpa-onnx
# binaries (no CMake/C++). The release build ships with this enabled so real
# speech works out of the box for end users. See README "Build & packaging".
sherpa = ["dep:sherpa-rs"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
